<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roulette Strategy Pro - Unit & Spin Logic</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 1100px; width: 100%; }
        
        /* European Table */
        .roulette-table { 
            display: grid; 
            grid-template-columns: 60px repeat(12, 1fr); 
            gap: 4px; background: #064e3b; 
            padding: 15px; border: 4px solid #334155; 
            border-radius: 12px; margin-bottom: 20px;
        }
        .cell { 
            aspect-ratio: 1/1.3; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; cursor: pointer; border-radius: 6px; 
            border: 1px solid rgba(255,255,255,0.1); transition: 0.2s;
        }
        .green { background: #15803d; grid-row: span 3; aspect-ratio: auto; }
        .red { background: #b91c1c; }
        .black { background: #0f172a; }
        .highlight { border: 3px solid #fbbf24; box-shadow: 0 0 20px #fbbf24; transform: scale(1.04); z-index: 10; }

        .dashboard { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        .panel { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .prediction-display { font-size: 2.2rem; color: #fbbf24; text-align: center; font-weight: 800; margin: 15px 0; min-height: 80px; }
        .unit-badge { background: #1d4ed8; color: white; padding: 5px 15px; border-radius: 20px; font-size: 1.2rem; margin-top: 10px; display: inline-block; }
        
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; color: #94a3b8; }
        .stop-msg { color: #ef4444; font-size: 1.5rem; text-align: center; animation: blink 1s infinite; }
        
        button { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; margin-bottom: 8px; }
        button:hover { background: #2563eb; }
        button.empty-btn { background: #64748b; }
        button.empty-btn:hover { background: #475569; }
        
        textarea { width: 100%; height: 100px; background: #0f172a; color: #10b981; border: 1px solid #334155; padding: 10px; border-radius: 8px; resize: none; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="status-bar">
        <div id="spinCounter">SPIN: 0 / 65</div>
        <div id="sessionStatus">SESSION ACTIVE</div>
    </div>

    <div id="table" class="roulette-table">
        <div class="cell green" onclick="handleInput(0)">0</div>
    </div>

    <div class="dashboard">
        <div class="panel">
            <div id="stopContainer">
                <div style="text-align:center; font-size: 0.9rem; color: #94a3b8;">PREDICTION & RECOMMENDED UNIT</div>
                <div class="prediction-display" id="predictionText">--</div>
                <div style="text-align:center" id="unitDisplay"></div>
            </div>
            <button class="empty-btn" onclick="addEmptySpin()">+ Add Empty (Waiting) Spin</button>
            <button style="background:#dc2626" onclick="resetSession()">Reset Session</button>
            <div id="historyText" style="font-size: 0.85rem; color: #64748b; margin-top: 15px; word-break: break-all;">History: </div>
        </div>

        <div class="panel">
            <h3>Bulk Simulation</h3>
            <textarea id="bulkData" placeholder="Paste roulette numbers..."></textarea>
            <button onclick="simulate()">Run Accuracy & Unit Test</button>
            <div id="results" style="margin-top:10px; font-size: 0.9rem;"></div>
        </div>
    </div>
</div>

<script>
    // Unit Progression from your CSV
    const unitProgression = {
        1: 10, 2: 10, 3: 10, 4: 10, 5: 10, 6: 10, 7: 10, 8: 10, 9: 10, 10: 10,
        11: 20, 12: 20, 13: 20, 14: 20, 15: 20, 16: 20, 17: 20, 18: 20, 19: 20, 20: 20,
        21: 30, 22: 30, 23: 30, 24: 30, 25: 30, 26: 40, 27: 40, 28: 50, 29: 50, 30: 60,
        31: 60, 32: 70, 33: 80, 34: 90, 35: 100, 36: 100, 37: 100, 38: 100, 39: 100, 40: 100,
        41: 100, 42: 100, 43: 100, 44: 100, 45: 100, 46: 110, 47: 110, 48: 120, 49: 120, 50: 130,
        51: 130, 52: 140, 53: 140, 54: 150, 55: 150, 56: 160, 57: 160, 58: 170, 59: 170, 60: 170,
        61: 180, 62: 180, 63: 190, 64: 200, 65: 200
    };

    // Strict Pair Logic + Specific 1-8 Pair
    const basePairs = [
        [1, 7], [1, 8], [2, 8], [4, 10], [5, 11], [7, 13], [8, 14], 
        [10, 16], [11, 17], [13, 19], [14, 20], [16, 22], [17, 23], 
        [19, 25], [20, 26], [22, 28], [23, 29], [25, 31], [26, 32], 
        [28, 34], [29, 35]
    ];

    const map = {};
    basePairs.forEach(([a, b]) => {
        if (!map[a]) map[a] = new Set();
        if (!map[b]) map[b] = new Set();
        map[a].add(b);
        map[b].add(a);
    });

    let history = [];
    let spinCount = 0;
    let maxSpins = 65;
    let emptySpinsUsed = 0;
    let isStopped = false;

    function buildTable() {
        const table = document.getElementById('table');
        const reds = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
        const rows = [[], [], []];
        for (let i = 1; i <= 36; i++) rows[(3 - (i % 3)) % 3].push(i);
        [0, 1, 2].forEach(rIdx => {
            rows[rIdx].sort((a,b) => a-b).forEach(num => {
                const div = document.createElement('div');
                div.className = `cell ${reds.includes(num) ? 'red' : 'black'}`;
                div.id = `num-${num}`;
                div.innerText = num;
                div.style.gridRow = rIdx + 1;
                div.onclick = () => handleInput(num);
                table.appendChild(div);
            });
        });
    }

    function handleInput(val) {
        if (isStopped) return;
        spinCount++;
        history.push(val);
        updateUI(val);
    }

    function addEmptySpin() {
        if (isStopped) return;
        spinCount++;
        emptySpinsUsed++;
        if (emptySpinsUsed >= 1) maxSpins = 70; // Extend if waiting is used
        history.push("Empty");
        updateUI(null);
    }

    function updateUI(lastNum) {
        const pText = document.getElementById('predictionText');
        const uDisp = document.getElementById('unitDisplay');
        const sCount = document.getElementById('spinCounter');
        
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight'));
        
        if (spinCount >= maxSpins) {
            isStopped = true;
            document.getElementById('stopContainer').innerHTML = `<div class="stop-msg">STOP - SESSION ENDED</div>`;
            document.getElementById('sessionStatus').innerText = "LIMIT REACHED";
            return;
        }

        sCount.innerText = `SPIN: ${spinCount} / ${maxSpins}`;

        if (lastNum !== null) {
            const preds = map[lastNum] ? Array.from(map[lastNum]) : null;
            if (preds) {
                pText.innerHTML = `${lastNum} <span style="color:#64748b">➔</span> ${preds.join(', ')}`;
                preds.forEach(p => document.getElementById(`num-${p}`).classList.add('highlight'));
            } else {
                pText.innerText = `${lastNum} (No Pred)`;
            }
        } else {
            pText.innerText = "Waiting...";
        }

        // Unit Logic: First 5 results no unit. 6th onwards show unit.
        if (spinCount > 5) {
            const unit = unitProgression[spinCount] || unitProgression[65];
            uDisp.innerHTML = `<div class="unit-badge">Place ${unit} Units</div>`;
        } else {
            uDisp.innerHTML = `<span style="color:#64748b">Observation Phase (Spins 1-5)</span>`;
        }

        document.getElementById('historyText').innerText = "History: " + history.slice(-15).join(', ');
    }

    function resetSession() {
        location.reload();
    }

    function simulate() {
        const data = document.getElementById('bulkData').value;
        const nums = data.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
        let resultsHtml = "<h4>Simulation Report:</h4>";
        
        for (let i = 0; i < Math.min(nums.length, 65); i++) {
            const current = nums[i];
            const next = nums[i+1];
            const units = (i + 1) > 5 ? (unitProgression[i + 1] || 200) : "N/A";
            const preds = map[current] ? Array.from(map[current]) : [];
            const isHit = preds.includes(next);
            
            if (isHit) {
                resultsHtml += `<div style="color:#10b981">Spin ${i+1}: HIT! (${current}➔${next}) at ${units} units</div>`;
                break; // Stop on hit
            }
        }
        document.getElementById('results').innerHTML = resultsHtml;
    }

    buildTable();
</script>

</body>
</html>
